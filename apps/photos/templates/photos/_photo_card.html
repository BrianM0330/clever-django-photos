{% load photo_tags static %}

<article id="photo-{{ photo.pk }}" class="group">
  <div class="relative aspect-square overflow-hidden rounded-2xl border border-gray-100 bg-gray-100 shadow-sm transition duration-300 group-hover:-translate-y-0.5 group-hover:shadow-xl dark:border-zinc-800 dark:bg-zinc-900" style="background-color: {{ photo.avg_color }}">
    <a href="{{ photo.src_large2x }}"
       class="block h-full w-full cursor-zoom-in focus:outline-none focus-visible:ring-2 focus-visible:ring-clever-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-zinc-950"
       aria-label="Open {{ photo.alt }}"
       data-pswp-width="{{ photo.width }}"
       data-pswp-height="{{ photo.height }}"
       data-pswp-srcset="{% photo_srcset photo %}"
       data-pswp-caption="By {{ photo.photographer }}">
      <img src="{{ photo.src_medium }}"
           srcset="{% photo_srcset photo %}"
           sizes="(min-width: 1024px) 25vw, (min-width: 640px) 50vw, 100vw"
           alt="{{ photo.alt }}"
           class="h-full w-full object-cover"
           loading="lazy">
    </a>

    <div class="absolute right-3 top-3 z-10">
      {% include "photos/_like_button.html" with photo=photo %}
    </div>
  </div>

  <div class="mt-3.5 flex items-start justify-between gap-3">
    <div class="min-w-0">
      <h2 class="truncate text-sm font-medium tracking-tight text-gray-900 dark:text-zinc-100">
        <span class="font-normal text-gray-500 dark:text-zinc-500">By</span>
        <span class="font-semibold">{{ photo.photographer }}</span>
      </h2>
      <div class="relative mt-1.5 flex max-w-full items-center gap-2" x-data="copySource">
        <button type="button"
                class="inline-flex shrink-0 cursor-pointer items-center justify-center text-zinc-500 transition hover:text-zinc-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-clever-500 dark:text-zinc-500 dark:hover:text-zinc-200"
                @click="copy('{{ photo.url|escapejs }}')"
                aria-label="Copy source URL for photo by {{ photo.photographer }}">
          <svg class="h-4 w-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>
        <span x-show="copied" x-text="message" x-cloak x-transition class="absolute -top-8 left-0 rounded-full bg-zinc-950 px-2.5 py-1 text-xs font-medium text-white shadow-sm dark:bg-white dark:text-zinc-950" role="status" aria-live="polite">Copied</span>
        <a href="{{ photo.url }}"
           target="_blank"
           rel="noopener noreferrer"
           class="inline-flex min-w-0 items-center gap-1.5 text-sm font-normal leading-none text-zinc-500 transition hover:text-clever-400">
          <img src="{% static 'images/links.svg' %}" alt="" aria-hidden="true" class="h-4 w-4 shrink-0 opacity-80">
          <span class="truncate">{{ photo.url }}</span>
        </a>
      </div>
    </div>
  </div>
</article>
